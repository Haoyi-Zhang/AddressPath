name: Scientific checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reproduce owned finite models and regressions
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 2097152
          ulimit -t 1200
          cpu=$(python -B -c 'import os; print(min(os.sched_getaffinity(0)))')
          timeout --signal=TERM --kill-after=15s 1200s \
            taskset -c "$cpu" python -B final_reproduce.py \
              --keep --output reproduction 2>&1 | tee scientific-checks.log
      - name: Exact signature-set regressions
        run: |
          timeout 180s python -B -m unittest -v tests/test_signature_sets.py
      - name: Upload raw results on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scientific-raw-output
          path: |
            scientific-checks.log
            reproduction/
            reproduction.*.log
          if-no-files-found: warn
          retention-days: 14
